name: prop
pipeline: model
output_folder: Models
face_budget: prop_faces
# Owner-declared (props criterion v2, 2026-10-21): after hidden inner parts are removed, a mesh with more than
# five separate parts fails as component_budget and the next seed is tried.
max_components: 5
# Owner-declared (2026-10-21): the base colour must keep the concept's hue (CIE hue difference dH* at most 4)
# and at least 0.6 of its saturation; drift fails as colour_hue_shift / colour_desaturated and the next seed
# is tried. Near-grey concepts (chroma under 10) are not checked.
max_concept_hue_difference: 4
# Owner-accepted (2026-10-22): a mesh that fits the concept's outline under 0.8 fails as concept_fit and the next seed is tried: shattered
# reconstructions fitted 0.71-0.75, whole props 0.86-0.99 (2026-10-22). UV area stopped separating them once
# islands were padded by 4 texels (shattered 0.11-0.12, whole tree stumps 0.10-0.19).
min_concept_fit: 0.8
min_concept_chroma_ratio: 0.6
# Calibrated 2026-10-24 on 147 labelled concept-side views: a base colour that turns over 0.4 of the object dark
# where the concept is light fails as colour_darkened and the next seed is tried. The black-textured cliff, rock,
# sci-fi pillar and glass bottles measured 0.45-0.86; every accepted model 0.37 or less (dark-beamed timber 0.28-0.36).
max_concept_darkened_share: 0.4
requirements:
  - physical object with a clean silhouette
  - plausible from multiple viewing angles
  - isolated concept for reconstruction
  - game-ready polygon budget
  - complete object visible against a clean white background
  - no floor, pedestal, cast shadow, or unrelated props
avoid: [environment, concept sheets, multiple variants, fragile floating details, unnecessary tiny geometry]
# Published with a prefab a game can use: convex colliders and a Rigidbody of this mass; parts, when declared,
# get a socket, a clip, a trigger and a hold bool each (docs/WEAPONS.md, Moving parts).
unity_prefab: true
mass: 5.0
unity_layer: Props
# A prop that declares a hinge or slide (a chest's lid, a drawer) has its parts generated as weapons do
# (docs/WEAPONS.md, Moving parts; hybrid or omnipart); a part covering less of its concept mask than this is retried.
part_model: hybrid
min_part_coverage: 0.55
# OmniPart's sampler (sparse structure and parts): its defaults; more steps or a lower guidance can be tried per
# type, and a change regenerates the parts.
part_steps: 25
part_cfg: 7.5
# A hinge or slide swept through its declared range in the final pass: over this share of its vertices going inside
# the rest of the model, deeper than half a percent of the model's size, the seed is retried (part_penetrates); Unity
# repeats the check on the prefab.
max_part_penetration: 0.02
# The model seen from 14 directions, at rest and with each part at the end of its range: a share of what is
# seen above this is the backs of faces, holes a player sees, and the seed is retried (part_open). Hybrid
# pieces left open read 0.022 with a pistol's slide back, closed by their interfaces 0.004 (2026-10-25).
max_visible_backfaces: 0.01
# A share of the object above this that is clearly coloured in the concept but grey in the base colour, seen from
# the concept's side, is retried (colour_lost): a black pistol's greyed walnut grips read 0.25, wood-gripped seeds
# 0.00-0.04 (2026-10-25).
max_concept_desaturated_share: 0.1
# The share of a mesh's edges whose faces point opposite ways: a thin surface crumpled by the reduction (sound
# meshes read 0.00-0.02); over this the seed is retried (mesh_folded).
max_folded_edge_share: 0.1
# Generated parts' textures come out darker and duller than the concept: their colours are moved to the concept's
# from its side (docs/MATERIALS.md).
concept_colour_transfer: true
