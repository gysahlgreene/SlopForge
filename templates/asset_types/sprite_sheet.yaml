name: sprite_sheet
pipeline: image
output_folder: Characters/Spritesheets
format: PNG
alpha_required: false
alpha_recommended: true
requirements:
  - one character identity matches the approved reference
  - frames use a fixed grid with equal cell dimensions
  - frame order is left-to-right and top-to-bottom
  - transparent background where the configured workflow supports alpha
avoid:
  - captions, labels, borders, or contact-sheet decoration outside the frame grid
