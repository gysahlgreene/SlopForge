name: tile_sheet
pipeline: image
output_folder: Tilesets/Spritesheets
format: PNG
alpha_recommended: true
requirements:
  - tiles occupy equal cells in a configurable row-major grid
  - tile edges align cleanly for the selected layout
  - transparent regions remain transparent where the art calls for them
  - sheet contains no labels, grid lines, or decoration outside the tiles
avoid:
  - perspective scene or camera angle
  - inconsistent tile dimensions
  - contact-sheet borders or text
