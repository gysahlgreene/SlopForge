name: weapon
pipeline: model
output_folder: Weapons
face_budget: weapon_faces
# The profile's weapon graph: TRELLIS.2 with Blender's reduction, also on h100_final.
model_workflow: weapon_model
# Weapons are drawn side-on on a wide canvas; --aspect overrides it per asset.
aspect: wide
# Held at the grip: the origin sits at the centre of the --part grip mask, the tip or muzzle points along -Y
# (Unity +Z) and the top along +Z, oriented from the view that best fits the concept.
pivot: grip
# The prop limits the owner accepted (2026-10-21 to 2026-10-24), not yet calibrated on weapons.
max_components: 5
max_concept_hue_difference: 4
min_concept_chroma_ratio: 0.6
max_concept_darkened_share: 0.4
# Small coloured regions (grips, stocks) are shifted towards the concept's colours from its side: the whole-object
# checks passed a pistol's rosewood grips decoded orange-brown on every seed (docs/MATERIALS.md).
concept_colour_transfer: true
min_concept_fit: 0.8
# Replaces the props' "no thin parts" rule, which a blade or a bowstring cannot follow.
reconstruction_rule: >-
  Crisp hard-surface forms with clean edges; blades, guards, limbs and barrels drawn with their real thickness,
  not paper-thin; a bowstring drawn as one taut straight line; no loose straps, tassels, chains or floating parts
requirements:
  - one weapon in a flat side profile, lying horizontally, tip or muzzle pointing right, grip on the left
  - the whole weapon in frame with margin at both ends
  - each moving part drawn as a distinct piece
  - complete object visible against a clean white background
avoid: [hands, holsters, sheaths, scabbards, straps, mounts, multiple weapons, environment, cast shadow]
# A weapon that declares a hinge or slide is generated as separate parts by OmniPart (docs/WEAPONS.md, Moving
# parts); a part whose mesh covers less of its concept mask than this is part_missing and the next seed is tried.
# Calibrated on the first live runs (2026-10-25): passing parts covered 0.61-0.96, rejected ones 0.18-0.38.
part_model: omnipart
min_part_coverage: 0.55
# OmniPart's sampler (sparse structure and parts): its defaults; more steps or a lower guidance can be tried per
# type, and a change regenerates the parts.
part_steps: 25
part_cfg: 7.5
# A hinge or slide swept through its declared range in the final pass: over this share of its vertices inside the
# rest of the model (over rest), the seed is retried (part_penetrates); Unity repeats the check on the prefab.
max_part_penetration: 0.02
# Weapons are seen at arm's length: the generated parts' textures and the atlas are baked at this size, and Unity
# imports the maps at it (its default ceiling of 2048 would halve them).
texture_size: 4096
# Published with a prefab a game can use: convex colliders, a Rigidbody of this mass, sockets (grip, muzzle, each
# part), and an Animator with Rest, a trigger and a hold bool per part. The layer is set when the project has it.
unity_prefab: true
mass: 1.0
unity_layer: Weapons
