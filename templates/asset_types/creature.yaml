name: creature
pipeline: model
output_folder: Creatures
# A creature is generated like a prop (the TRELLIS.2 route), then rigged by `slopforge creature rig` (B1) and
# animated (M5; docs/CREATURES.md). The character budget, not the prop's: the bounded check's wolf (#129), cut to the
# prop budget (28,472 faces), read as low-poly in its fur outline and thin legs (owner, 2026-10-27).
face_budget: character_faces
max_components: 5
max_concept_hue_difference: 4
min_concept_fit: 0.8
min_concept_chroma_ratio: 0.6
max_concept_darkened_share: 0.4
remove_hidden_faces: true
# A creature deforms, so Unity lights it with probes, never a lightmap; Unity's lightmap unwrap of a 57,000-face wolf
# also aborted and left its FBX without the material (2026-10-27).
lightmap_uvs: false
requirements:
  - one four-legged creature standing still on all four feet, in a side three-quarter view
  - legs straight and slightly apart, so each leg is clearly separate from the others and from the body
  - head and neck in line with the body, the muzzle pointing straight ahead the way the body faces, not turned toward the viewer
  - mouth closed, a tail hanging apart from the hind legs
  - complete animal with plausible anatomy, isolated on a plain light background
avoid: [humanoid, rider, saddle or harness, multiple creatures, action pose, crossed or hidden legs, wings, floor,
        pedestal, cast shadow, head turned toward the viewer]
# The limb declaration the rig is checked against: legs that stand on the ground, in front and hind pairs. Quadrupeds
# only for now (owner decision D12); a leg TRELLIS.2 paints on the body has no geometry to rig and fails B1.
limbs:
  ground_contact: 4
# Twin legs' joints must mirror within this share of the creature's height (owner ruling, 2026-10-27; a value per
# type). Bounded check #129: the passing wolf seed mirrored within 0.005, a failing seed 0.28; B1's live wolf 0.025-0.05.
max_rig_asymmetry: 0.05
# Spine bones the body must have between the hips and chest (provisional, a value per type). The rabbit's SkinTokens seed
# 1 joined them directly, 61 cm apart, so its body could not bend, and every other check passed it (2026-10-31); the
# wolf has 4, the fixture 2.
min_rig_spine_bones: 2
# The muzzle may stand at most this share of the height off the line through the hips and chest (B1's check). The B1
# wolf's concept turned its head to the camera in a three-quarter view: 0.063-0.072 over three SkinTokens seeds (the
# muzzle about 5.5 cm off a 0.78 m wolf's line), and every front view showed the face angled (owner, 2026-10-30). A
# straight head reads near 0; the limit is provisional until a straight-headed creature is measured.
max_rig_head_turn: 0.05
# The finish straightens a turned head: Neck1..Head turned about the vertical until the muzzle is on the body's line,
# made the rest pose. Concepts asked to keep the head in line turned it the other way, away from the camera
# (2026-10-30); the owner chose to straighten it in the rig (2026-10-31). max_rig_head_turn then applies after it.
straighten_head: true
# SkinTokens seeds `creature rig` tries unless --seeds says otherwise; the best passing one is kept (the bounded check:
# 1 of 4 passed).
rig_seeds: 4
# The finished skin's weights. SkinTokens' own stretched the wolf's chest and face (edges over 1.5x their rest length:
# 16 % of the chest-shoulder region with a front leg lifted); bone heat on a closed voxel proxy of the skin, four bones
# a vertex at most, cut that 3-5x at the cost of some skin near the legs following the opposite leg a little. The
# owner chose it (2026-10-30, #154). `skintokens` keeps the model's weights.
skin_weights: proxy_heat
# B2 (docs/CREATURES.md, video2rig's start frame): the two views and their framing. The views and panels are the
# start frame the video route was proven from (#149): front and side in equal panels. In three-quarter + side, Wan 2.2
# turned the creature in 3 of 4 clips; in front + side with the split-screen prompt, in none. The reader reads a lifted
# front paw better from three-quarter, which a dead-front view stacks on the hind leg (#140: trunk joints read
# 0.99-1.0 against 0.65-0.69), so declare that pair where no video is generated. margin_wide keeps a long creature
# inside its side panel (#142). At 1.45 it set the wolf's scale (344 px tall) and all four clips that reached video2rig's
# check failed it; at 1.2 the height margin sets it, as in #149 (400 px), and the same seeds passed (B5's live gate).
# 2026-10-30: two views each leave a quadruped blind somewhere. Front + side reads the far legs' swing weakly (the
# owner: "robotic"); three-quarter + right side measured the right legs' sideways place in no view, and they crossed.
# Front + side with the wolf about 1.3x larger (margin 1.4; the narrow front view in a 640 px panel, the side in 1280)
# the owner judged "significantly better" (private evidence: views spike).
views: [front, side]
widths: [640, 1280]
margin: 1.4
margin_wide: 1.2
# Pictures the reader trains on (video2rig's reader.prepare --poses).
training_poses: 3000
# Joint ranges (#140), degrees from the start pose, by the role of B1's generic names. video2rig applies each to the
# bone's bend, twist and sideways turn alike, replacing its per-channel priors (a paw's twist 20 and one-way bend, a
# toe's twist 10; its default twist 69). Values are video2rig's own bend limits for these names (spike #129's exams ran
# on them; Tail, Scapula and UpperArm have none there: its default bend, 160); FrontPaw 150, as the Khronos Fox's
# authored walk folds its front paws 148. An end bone takes its chain's (HindToesEnd: HindToes), else End (an end off
# a knee or elbow, such as a dewclaw). Knees (Shin) and elbows (Forearm) are one-way hinges with video2rig's own limits
# and the root (Hips) is free, so they take none.
joint_limits:
  Spine: 35
  Chest: 35
  Neck: 45
  Head: 60
  HeadEnd: 60
  Tail: 160
  Scapula: 160
  UpperArm: 160
  FrontPaw: 150
  FrontToes: 90
  Thigh: 130
  HindPaw: 100
  HindToes: 90
  End: 45
# B5 (docs/CREATURES.md, "Video generation"): a motion clip generated from the start frame. The ComfyUI graph; how the
# prompt names each view of the start frame ({name} and {side} filled in; front and side are #149's wording, the
# three-quarter line is untried); each motion's template ({subject} is the asset's description, {left} and {right}
# the panels' cameras), its frames (1 + 4k; 121 gave a full walk cycle in every #149 clip whose check ran, 81 one step)
# and its retry budget (D6: seeds tried beyond the clips asked for).
video_workflow: workflows/video_wan22_i2v_api.json
video_views:
  front: "a fixed camera straight in front of the {name}; the {name} keeps facing this camera the whole time, its nose pointing straight at it."
  side: "a fixed camera at the {name}'s {side} side; the {name} keeps its {side} side to this camera the whole time, its head to the {side} of the picture."
  three-quarter: "a fixed camera in front of the {name} and to its left; the {name} keeps its head and chest turned to this camera the whole time."
video_motions:
  walk:
    frames: 121
    retries: 4
    # the fit's own ranges for this motion, by role, within joint_limits (the reader still trains on those): fitted
    # within the type's 150 / 90, noisy toe readings snapped a front paw up to 118 deg in one frame; within 90 / 60, at
    # most 78, and the owner chose that fit (2026-10-30, fit D)
    fit_joint_limits: {FrontPaw: 90, FrontToes: 60}
    prompt: >-
      Split-screen video from two synchronised fixed cameras filming the same {subject} at the same moment, in a plain
      grey studio with a level floor and soft constant lighting. Left half: {left} Right half: {right} The {name} walks
      continuously on the spot for the whole clip, from the first frame to the last, at a calm, steady walking pace,
      and never stops: all four legs step in turn, left hind, left fore, right hind, right fore, again and again, each
      foot lifting clear of the floor and being set down again, its body staying in the same place and pointing the
      same way; it never turns, never rotates and never changes direction. Its head stays forward and its tail hangs
      relaxed. It has exactly four legs. Both halves show the same {name} at the same moment, moving together. Static
      cameras, no zoom, no cuts, no camera shake, no slow motion, no motion blur. Keep the whole body inside the frame
      the whole time; nothing crosses the dark line between the two halves. No visual effects of any kind: no dust, no
      smoke, no debris, no sparks, no particles, no speed lines, no motion trails, no light trails, no motion blur, no
      camera shake. Every limb stays sharp, the flat floor stays perfectly clean, and every foot stays clearly visible
      in every frame.
    # Wan 2.2's own default negative list, then the effects, extra or missing legs, turning and stopping (#149)
    negative: >-
      色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走,
      dust, smoke, debris, sparks, particles, speed lines, motion trails, light trails, motion blur, camera shake,
      camera movement, zoom, cuts, scene change, extra legs, three legs, five legs, extra animals, second {name}, text,
      watermark, walking forward out of frame, turning, turning around, turning sideways, turning its body, rotating,
      rotating body, changing direction, standing still, pausing, stopping, stops walking, standing, idle, frozen,
      static pose
# Intake (slopforge/video_intake.py), fail-closed before anything reads a clip. Set from #149's 40 Wan clips (good:
# the backdrop's largest change from frame 0 1-6.7 and 10.7 on the one whose check still ran, motion 0.048+, outline
# shape change 0.05-0.14, frame 0 3-6.5 grey levels from the start image, the creature in every frame of every panel;
# refused: backdrop 11.7-23.7, still panels 0.0016-0.009, turning 0.31-1.4), and D7's cross-view limits from exam v1
# (video2rig's check: body 1.5 %, limbs 2 % of the height).
video_intake:
  max_video_duplicate_share: 0.05
  max_video_frame0_difference: 12
  min_video_presence: 0.98
  max_video_backdrop_drift: 11
  min_video_motion_share: 0.02
  max_video_turn: 0.25
  max_video_view_disagreement: 0.015
  max_video_limb_disagreement: 0.02
# B4 (docs/CREATURES.md, "Computed walk"): motions computed on the rig by blender/procedural_gait.py, then baked and
# reviewed as a clip is. Stride and lift are shares of the creature's height. The wolf (2026-10-31): a stride of 0.9
# reached past its legs and the body sank 7 cm to keep the feet down; 0.75 sinks it 4.7 cm, carried level; the period
# is snapped to whole 24 fps frames (1.2 s -> 29 frames) so the loop closes on a frame.
procedural_motions:
  walk:
    period_s: 1.2
    duty: 0.62
    stride: 0.75
    lift: 0.06
    seconds: 6.0
  # one 6 s loop (whole frames): three breaths, the weight shifted side to side by 0.7 % of the height, the head looking
  # 7 degrees to each side and nodding a quarter of that, the tail swaying 4 degrees twice; the feet stay put. The
  # owner judged 1.2 %, 12 and 6 on the wolf "almost right, just a bit too exaggerated" (2026-10-31).
  idle:
    seconds: 6.0
    breaths: 3
    sway: 0.007
    look_deg: 7
    tail_deg: 4
