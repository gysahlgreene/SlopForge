# A sci-fi corridor kit on a 3 m grid (M2 protocol kit, 2026-10-22). Painted panels, steel trim and a cyan
# emissive strip, so no shared kit material.
# Owner-accepted M2 budgets (2026-10-22): floor 15k faces, walls/doorway/window/corner 40k, pillar 20k, maps 2048².
id: scifi_corridor_kit
version: 1
description: A modular sci-fi corridor kit with floor, wall, doorway, corner and pillar modules.
kit_constraints:
  grid_size: 1.0
  snap_tolerance: 0.05
  pivot_tolerance: 0.05
  max_dimension: 8.0
  pivot: bottom_center
  max_stretch: 1.3
  modules:
    floor:
      target_size:
      - 3
      - 3
      - null
      snap_axes:
      - 0
      - 1
      flat_axis: 2
      max_dimension: 4.1
      pivot: top_center
      face_budget: 15000
      texture_size: 2048
    wall:
      target_size:
      - 3
      - 0.5
      - 3
      snap_axes:
      - 0
      - 2
      vertical_axis: 2
      max_dimension: 4.1
      face_budget: 40000
      texture_size: 2048
    doorway:
      target_size:
      - 3
      - 0.5
      - 3
      snap_axes:
      - 0
      - 2
      vertical_axis: 2
      max_dimension: 4.1
      face_budget: 40000
      texture_size: 2048
    corner:
      target_size:
      - 3
      - 3
      - 3
      vertical_axis: 2
      footprint: corner
      arm_thickness: 0.5
      face_budget: 40000
      texture_size: 2048
    pillar:
      target_size:
      - null
      - null
      - 3
      vertical_axis: 2
      face_budget: 20000
      texture_size: 2048
children:
- id: floor
  type: architecture
  description: A square sci-fi floor plate.
  generation_prompt: 'One square modular sci-fi floor tile, low and flat: thick dark grey steel deck plates with
    a raised diamond tread pattern, recessed seams between four plates, straight clean outer edges and a flat underside.
    Viewed from a high three-quarter angle, isolated on a plain light-grey background.'
  materials:
  - 'deck=metal: dark grey steel tread plate'
- id: wall
  type: architecture
  description: A straight sci-fi corridor wall panel.
  # On a square canvas the S1 seeds' walls reconstructed 1.27-1.64 times wider than tall (one of six within the 1.3
  # stretch limit); on portrait, 1.15-1.28 (six of six). M2-v1 finding, 2026-10-23.
  aspect: portrait
  generation_prompt: 'One straight modular sci-fi corridor wall section, as wide as it is tall: large matte light
    grey painted steel panels with recessed seams and small rivets, a dark grey steel base trim along the bottom,
    and one horizontal cyan light strip across the middle, shown unlit as a solid flat cyan surface. Thick even
    depth, flat vertical ends and a flat top. Plain matching back. Front three-quarter view, isolated on a plain
    light-grey background.'
  materials:
  - 'panels=nonmetal: matte light grey painted steel panels'
  - 'trim=metal: dark grey steel'
  - 'strip=emissive#30c8d8: cyan light strip'
- id: doorway
  type: architecture
  description: A sci-fi corridor wall panel with a door opening.
  generation_prompt: 'One modular sci-fi corridor wall section, as wide as it is tall: matte light grey painted
    steel panels with recessed seams, and one human-sized rectangular door opening in the centre with a thick yellow
    and black hazard-striped frame, the opening empty. Thick even depth, flat vertical ends and a flat top. Plain
    matching back. Front three-quarter view, isolated on a plain light-grey background.'
  materials:
  - 'panels=nonmetal: matte light grey painted steel panels'
  - 'frame=nonmetal: painted yellow and black hazard stripes'
- id: corner
  type: architecture
  description: A 90-degree sci-fi corridor corner.
  aspect: landscape
  generation_prompt: 'One L-shaped 90-degree corner wall module of a sci-fi corridor: two equal straight arms joined
    at a right angle, matte light grey painted steel panels with recessed seams, the same height as its arm length,
    thick even depth, flat ends and flat top. Front three-quarter view, isolated on a plain light-grey background.'
  materials:
  - 'panels=nonmetal: matte light grey painted steel panels'
- id: pillar
  type: architecture
  description: A square sci-fi support pillar.
  generation_prompt: One thick square sci-fi support pillar of dark grey steel with a wider square base and top
    cap, recessed vertical grooves, and one vertical cyan light strip on its front, shown unlit as a solid flat
    cyan surface. Chunky proportions. Front three-quarter view, isolated on a plain light-grey background.
  materials:
  - 'pillar=metal: dark grey steel'
  - 'strip=emissive#30c8d8: cyan light strip'
