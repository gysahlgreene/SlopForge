id: starter_ui_pack
version: 1
description: A coherent no-copy UI kit for a Unity prototype.
children:
  - id: panel_landscape
    type: ui
    description: Wide HUD panel with generous empty content areas.
    generation_prompt: >-
      Single front-facing 16:9 game HUD panel, coherent with the selected UI theme,
      clean nine-slice-friendly corners and straight borders, empty content areas,
      no text, no letters, no numbers, no symbols that resemble copy, no mock screenshot.
    count: 1
  - id: panel_portrait
    type: ui
    description: Tall menu panel matching the HUD panel.
    generation_prompt: >-
      Single front-facing portrait game menu panel matching the same UI theme,
      nine-slice-friendly corners and straight borders, large empty content area,
      no text, no letters, no numbers, no mock screenshot.
    count: 1
  - id: button_normal
    type: ui
    description: Normal button state.
    generation_prompt: >-
      Single centered normal-state game UI button matching the shared theme, blank
      interior for Unity-rendered text, front-facing, no text, letters, numbers, or icons.
    count: 1
  - id: button_hover
    type: ui
    description: Hover button state matching the normal state.
    generation_prompt: >-
      Same shape and framing as the normal button state, hover highlight only, blank
      interior for Unity-rendered text, no text, letters, numbers, or icons.
    count: 1
  - id: button_pressed
    type: ui
    description: Pressed button state matching the normal state.
    generation_prompt: >-
      Same shape and framing as the normal button state, pressed/depressed treatment
      only, blank interior, no text, letters, numbers, or icons.
    count: 1
  - id: button_disabled
    type: ui
    description: Disabled button state matching the normal state.
    generation_prompt: >-
      Same shape and framing as the normal button state, muted disabled treatment only,
      blank interior, no text, letters, numbers, or icons.
    count: 1
  - id: tab_normal
    type: ui
    description: Unselected tab component.
    generation_prompt: >-
      Single blank unselected game UI tab, matching the shared theme and panel edge,
      clean silhouette, no text, letters, numbers, or symbols.
    count: 1
  - id: tab_selected
    type: ui
    description: Selected tab component matching the unselected tab.
    generation_prompt: >-
      Same geometry and framing as the unselected tab, selected highlight only, blank
      interior, no text, letters, numbers, or symbols.
    count: 1
  - id: inventory_slot_normal
    type: ui
    description: Empty inventory slot.
    generation_prompt: >-
      Single square empty inventory slot frame, shared UI theme, transparent or empty
      center for a Unity item icon; no item, no text, no letters, and no numbers.
    count: 1
  - id: inventory_slot_selected
    type: ui
    description: Selected inventory slot matching the normal slot.
    generation_prompt: >-
      Same geometry as the empty inventory slot, selected outline/glow only, empty
      transparent center; no item, no text, no letters, and no numbers.
    count: 1
  - id: tooltip
    type: ui
    description: Empty tooltip panel with a text-safe region.
    generation_prompt: >-
      Single compact tooltip panel, matching shared UI theme, clear blank region for
      Unity-rendered title and description, no text, letters, numbers, or icons.
    count: 1
  - id: health_bar
    type: ui
    description: Health bar frame and empty fill channel.
    generation_prompt: >-
      Horizontal health bar UI frame with a simple empty interior channel for runtime
      fill and Unity label, shared theme, no text, letters, numbers, or fake copy.
    count: 1
  - id: mana_bar
    type: ui
    description: Mana bar matching the health bar.
    generation_prompt: >-
      Same geometry as the health bar, mana-themed accent color only, empty runtime
      fill channel, no text, letters, numbers, or fake copy.
    count: 1
  - id: stamina_bar
    type: ui
    description: Stamina bar matching the health bar.
    generation_prompt: >-
      Same geometry as the health bar, stamina-themed accent color only, empty runtime
      fill channel, no text, letters, numbers, or fake copy.
    count: 1
  - id: ability_slot
    type: ui
    description: Ability icon frame with cooldown-safe overlay area.
    generation_prompt: >-
      Single square ability slot frame matching the shared theme, empty icon center and
      clear overlay area for Unity cooldown treatment; no icon and no text, letters, or numbers.
    count: 1
  - id: portrait_frame
    type: ui
    description: Character portrait frame.
    generation_prompt: >-
      Single ornate but readable character portrait frame, empty transparent center for
      a Unity portrait image, shared UI theme, no face, no text, no letters, and no numbers.
    count: 1
  - id: minimap_frame
    type: ui
    description: Empty minimap frame.
    generation_prompt: >-
      Single square minimap frame with a transparent empty center for a runtime map,
      shared UI theme, no map content, no text, no letters, and no numbers.
    count: 1
  - id: cursor
    type: ui
    description: Pointing cursor for the shared UI theme.
    generation_prompt: >-
      Single high-contrast pointing game cursor, isolated on transparent background,
      matching shared UI theme, no text, letters, numbers, or surrounding objects.
    count: 1
  - id: checkbox_unchecked
    type: ui
    description: Unchecked checkbox state.
    generation_prompt: >-
      Single empty square checkbox frame, normal state, matching shared UI theme, no
      checkmark or label; no text, letters, or numbers.
    count: 1
  - id: checkbox_checked
    type: ui
    description: Checked checkbox state matching unchecked state.
    generation_prompt: >-
      Same geometry as the unchecked checkbox, add only a clear checkmark, no label,
      no text, letters, or numbers.
    count: 1
  - id: slider_track
    type: ui
    description: Horizontal slider track and handle.
    generation_prompt: >-
      Single horizontal UI slider track with a centered handle, shared theme, no text,
      value labels, ticks with numbers, or background.
    count: 1
