id: starter_icons
version: 1
description: A small, coordinated set of inventory icons.
children:
  - id: health
    type: icon
    description: Health potion icon for a compact inventory slot.
    generation_prompt: >-
      Single centered red healing potion with a bright readable silhouette,
      painted fantasy game icon, transparent background, no text.
    count: 1
  - id: mana
    type: icon
    description: Mana potion icon matching the health potion's visual treatment.
    generation_prompt: >-
      Single centered blue mana potion with a bright readable silhouette,
      painted fantasy game icon, transparent background, no text.
    depends_on: [health]
    count: 1
