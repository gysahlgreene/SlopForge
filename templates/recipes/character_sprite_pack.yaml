id: character_sprite_pack
version: 1
description: Generate a reference-conditioned set of character animation sprite sheets.
children:
  - id: idle
    type: sprite_sheet
    description: Idle animation sheet, preserving the approved character identity.
    generation_prompt: >-
      Use the approved character identity reference. Create exactly eight evenly sized
      animation frames in one horizontal row, in left-to-right playback order. Idle:
      subtle breathing and weight shift, full body, fixed camera and scale, consistent
      outfit, clean silhouette, transparent background if supported, no text.
    count: 1
