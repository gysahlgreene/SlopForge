    - 0
    - 4.5
  - module: wall
    position:
    - 3
    - 4.5
  - module: wall
    position:
    - -3
    - -4.5
  - module: doorway
    position:
    - 0
    - -4.5
  - module: wall
    position:
    - 3
    - -4.5
  - module: wall
    position:
    - -4.5
    - -3
    rotation: 90
  - module: wall
    position:
