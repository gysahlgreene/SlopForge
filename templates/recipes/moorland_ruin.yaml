# A moorland showcase scene (2026-10-23 prototype; owner: "this is perfect"). Every prompt below is the one that
# made the approved scene. Build each child, then `slopforge scene-render <run>` assembles the scene block below.
id: moorland_ruin
version: 1
description: 'A moorland showcase: rocks, ground and bark surfaces, foliage, a broken stone chapel and a small camp, assembled
  into a Unity scene with scene-render.'
kit_constraints:
  grid_size: 1.0
  snap_tolerance: 0.05
  pivot_tolerance: 0.05
  max_dimension: 8.0
  pivot: bottom_center
  modules:
    boulder:
      target_size:
      - null
      - null
      - 1.4
      pivot: bottom_center
    rock:
      target_size:
      - null
      - null
      - 0.7
      pivot: bottom_center
    outcrop:
      target_size:
      - null
      - null
      - 0.6
      pivot: bottom_center
    cliff:
      target_size:
      - null
      - null
      - 3.5
      pivot: bottom_center
    ruin_wall:
      target_size:
      - 3
      - null
      - null
      pivot: bottom_center
    ruin_window:
      target_size:
      - 3
      - null
      - null
      pivot: bottom_center
    ruin_corner:
      target_size:
      - 3
      - null
      - null
      pivot: bottom_center
    ruin_arch:
      target_size:                         # a declared width turns the long side onto x, so the layout's turn holds
      - 3.8
      - null
      - 3.6
      pivot: bottom_center
    ruin_column:
      target_size:
      - null
      - null
      - 2.4
      pivot: bottom_center
    ruin_drum:
      target_size:
      - 1.3
      - null
      - null
      pivot: bottom_center
    ruin_blocks:
      target_size:
      - 2.6
      - null
      - null
      pivot: bottom_center
    ruin_floor:
      target_size:
      - 3
      - 3
      - null
      pivot: bottom_center
children:
- id: meadow_grass
  type: tiling_material
  description: Meadow grass ground
  generation_prompt: 'Seamless tileable texture of short wild meadow grass: dense green blades, a few dry yellow tufts,
    small clover leaves and tiny white flowers, natural variation. Seen from directly above, flat top-down orthographic
    view filling the whole frame, evenly lit, no shadows, no horizon, no perspective, no border, no text.'
- id: forest_dirt
  type: tiling_material
  description: Forest floor ground
  generation_prompt: 'Seamless tileable texture of damp forest floor: dark brown soil scattered with fallen brown and orange
    leaves, small twigs, pine needles and a few small pebbles. Seen from directly above, flat top-down orthographic view
    filling the whole frame, evenly lit, no shadows, no horizon, no perspective, no border, no text.'
- id: gravel_path
  type: tiling_material
  description: Gravel path ground
  generation_prompt: 'Seamless tileable texture of a grey gravel path: small rounded and angular pebbles in grey and beige
    tones, packed into dusty soil. Seen from directly above, flat top-down orthographic view filling the whole frame, evenly
    lit, no shadows, no horizon, no perspective, no border, no text.'
- id: granite_rock
  type: tiling_material
  description: Granite slope ground
  generation_prompt: 'Seamless tileable texture of a weathered grey granite rock surface: rough fractured stone with fine
    speckle, thin cracks, pale lichen spots and a little green moss in the cracks. Seen from directly above, flat top-down
    orthographic view filling the whole frame, evenly lit, no shadows, no horizon, no perspective, no border, no text.'
- id: oak_bark
  type: tiling_material
  description: Oak bark
  generation_prompt: 'Seamless tileable texture of old oak tree bark: deep vertical furrows and rough ridges, grey-brown
    bark with small patches of green moss and pale lichen. Flat front-facing orthographic view filling the whole frame,
    evenly lit, no shadows, no border, no text.'
- id: birch_bark
  type: tiling_material
  description: Silver birch bark
  generation_prompt: 'Seamless tileable texture of silver birch bark: white papery bark with dark grey-black horizontal
    lenticels and rough dark cracked patches, a few peeling curls. Flat front-facing orthographic view filling the whole
    frame, evenly lit, no shadows, no border, no text.'
- id: pine_bark
  type: tiling_material
  description: Scots pine bark
  generation_prompt: 'Seamless tileable texture of Scots pine bark: thick reddish-brown and grey plates separated by deep
    dark fissures. Flat front-facing orthographic view filling the whole frame, evenly lit, no shadows, no border, no text.'
- id: oak_sprig
  type: foliage
  description: Leafy oak branch tip
  generation_prompt: 'The leafy tip of an oak branch: a thin brown twig with many overlapping green lobed oak leaves, some
    leaves lighter yellow-green and some darker, seen from the side, evenly lit, isolated on a plain pure white background,
    crisp edges, no ground, no shadow.'
- id: birch_sprig
  type: foliage
  description: Drooping birch twig
  generation_prompt: A thin drooping silver birch twig with many small triangular serrated bright green leaves along it,
    seen from the side, evenly lit, isolated on a plain pure white background, crisp edges, no ground, no shadow.
- id: pine_sprig
  type: foliage
  description: Scots pine branch tip
  generation_prompt: 'A single Scots pine branch tip: a brown twig densely covered with long dark green paired needles fanning
    out, seen from the side, evenly lit, isolated on a plain pure white background, crisp edges, no ground, no shadow.'
- id: wildflowers
  type: foliage
  description: Daisies and buttercups
  generation_prompt: 'A single small clump of wild meadow flowers: white ox-eye daisies and yellow buttercups on thin green
    stems with a few leaves, seen from the side, evenly lit, isolated on a plain pure white background, crisp edges, no
    ground, no shadow.'
- id: heather
  type: foliage
  description: Flowering heather clump
  generation_prompt: A single low clump of flowering purple heather with tiny pink-purple flowers on woody green stems,
    seen from the side, evenly lit, isolated on a plain pure white background, crisp edges, no ground, no shadow.
- id: boulder
  type: prop
  description: Large mossy granite boulder
  generation_prompt: One large weathered granite boulder, rounded and slightly flattened, wider than it is tall, with natural
    cracks and pits, patches of green moss and pale lichen on its top and in its cracks. A complete stone, front three-quarter
    view from slightly above, isolated on a plain light-grey background.
  materials:
  - 'rock=nonmetal: weathered grey granite with patches of green moss and pale lichen'
  aspect: landscape
- id: rock
  type: prop
  description: Medium angular granite rock
  generation_prompt: One medium angular granite rock with sharp broken faces and worn edges, a few moss patches in its crevices
    and pale lichen spots. A complete stone, front three-quarter view from slightly above, isolated on a plain light-grey
    background.
  materials:
  - 'rock=nonmetal: weathered grey granite with patches of green moss and pale lichen'
- id: outcrop
  type: prop
  description: Low flat granite outcrop
  generation_prompt: One low flat granite rock outcrop slab, much wider than it is tall, with layered stepped edges, cracks
    across its top, and green moss growing in the cracks and along its base. A complete stone, front three-quarter view
    from above, isolated on a plain light-grey background.
  materials:
  - 'rock=nonmetal: weathered grey granite with patches of green moss and pale lichen'
  aspect: landscape
- id: cliff
  type: prop
  description: Craggy granite cliff chunk
  generation_prompt: One tall craggy granite cliff chunk, a vertical rock wall section about twice as wide as it is deep,
    with deep vertical cracks, small ledges, and green moss on the ledges, flat bottom. A complete rock, front three-quarter
    view, isolated on a plain light-grey background.
  materials:
  - 'rock=nonmetal: weathered grey granite with patches of green moss and pale lichen'
  aspect: landscape
- id: ruin_wall
  type: architecture
  description: Ruined granite wall section
  generation_prompt: 'One section of a ruined weathered grey granite block wall about three metres long: large dressed stone
    blocks laid in courses with deep mortar joints, the top broken into a jagged stepped outline where blocks have fallen,
    tallest at one end and much lower at the other, a few blocks cracked and chipped, green moss along the broken top and
    in the joints, thick even depth, flat bottom. Both faces built alike. Front three-quarter view from slightly above,
    showing the broken top, isolated on a plain light-grey background.'
