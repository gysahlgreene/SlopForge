id: starter_tileset_pack
version: 1
description: A coordinated starter terrain and decoration tileset.
children:
  - id: terrain
    type: tile_sheet
    description: A 4x4 set of ground terrain variations.
    generation_prompt: >-
      Match the active environment art style. Create one 4 by 4 grid of sixteen distinct
      ground terrain tiles at equal scale, with a consistent top-down orthographic view,
      clean shared edges, row-major order, no grid lines, no labels, no outside border.
  - id: paths
    type: tile_sheet
    description: A 4x4 set of path and ground connector tiles.
    generation_prompt: >-
      Match the active environment art style and terrain palette. Create one 4 by 4 grid
      of sixteen top-down orthographic path tiles including straight, corner, junction,
      and end shapes, equal cells, clean edges, no grid lines or labels.
  - id: water
    type: tile_sheet
    description: A 4x4 set of water and shoreline tiles.
    generation_prompt: >-
      Match the active environment art style and terrain palette. Create one 4 by 4 grid
      of sixteen top-down water tiles including calm variations and shoreline transitions,
      equal cells, consistent scale, no grid lines, labels, or outside border.
  - id: cliffs
    type: tile_sheet
    description: A 4x4 set of cliff and elevation edge tiles.
    generation_prompt: >-
      Match the active environment art style and terrain palette. Create one 4 by 4 grid
      of sixteen top-down orthographic cliff edge, corner, and cap tiles with consistent
      height shading, equal cells, no grid lines or labels.
  - id: transitions
    type: tile_sheet
    description: A 4x4 set of terrain transition tiles.
    generation_prompt: >-
      Match the active environment art style and terrain palette. Create one 4 by 4 grid
      of sixteen top-down transition tiles blending the same two ground materials, with
      varied north/east/south/west edge masks, consistent scale, equal cells, no text.
  - id: vegetation
    type: tile_sheet
    description: A 4x4 set of small vegetation tiles.
    generation_prompt: >-
      Match the active environment art style. Create one 4 by 4 grid of sixteen isolated
      top-down vegetation tiles such as grasses, shrubs, and small rocks, consistent scale,
      transparent background where suitable, equal cells, no grid lines or labels.
  - id: buildings
    type: tile_sheet
    description: A 4x4 set of compact top-down building tiles.
    generation_prompt: >-
      Match the active environment art style. Create one 4 by 4 grid of sixteen compact
      top-down building footprint tiles with consistent orthographic scale, readable
      silhouettes, equal cells, no labels or outside border.
  - id: decorations
    type: tile_sheet
    description: A 4x4 set of small environment decoration tiles.
    generation_prompt: >-
      Match the active environment art style. Create one 4 by 4 grid of sixteen isolated
      top-down environment decoration tiles, consistent palette and scale, transparent
      background where suitable, equal cells, no grid lines or labels.
