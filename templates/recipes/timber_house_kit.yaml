# A half-timbered medieval house kit on a 3 m grid (M2 protocol kit, 2026-10-22). Two materials (oak beams and lime
# plaster), so no shared kit material: one swatch would give the beams the plaster's colour.
# Owner-accepted M2 budgets (2026-10-22): floor 15k faces, walls/doorway/window/corner 40k, pillar 20k, maps 2048².
id: timber_house_kit
version: 1
description: A modular half-timbered house kit with floor, wall, window, doorway and corner modules.
kit_constraints:
  grid_size: 1.0
  snap_tolerance: 0.05
  pivot_tolerance: 0.05
  max_dimension: 8.0
  pivot: bottom_center
  max_stretch: 1.3
  modules:
    floor:
      target_size:
      - 3
      - 3
      - null
      snap_axes:
      - 0
      - 1
      flat_axis: 2
      max_dimension: 4.1
      pivot: top_center
      face_budget: 15000
      texture_size: 2048
    wall:
      target_size:
      - 3
      - 0.4
      - 3
      snap_axes:
      - 0
      - 2
      vertical_axis: 2
      max_dimension: 4.1
      face_budget: 40000
      texture_size: 2048
    window:
      target_size:
      - 3
      - 0.4
      - 3
      snap_axes:
      - 0
      - 2
      vertical_axis: 2
      max_dimension: 4.1
      face_budget: 40000
      texture_size: 2048
    doorway:
      target_size:
      - 3
      - 0.4
      - 3
      snap_axes:
      - 0
      - 2
      vertical_axis: 2
      max_dimension: 4.1
      face_budget: 40000
      texture_size: 2048
    corner:
      target_size:
      - 3
      - 3
      - 3
      vertical_axis: 2
      footprint: corner
      arm_thickness: 0.4
      face_budget: 40000
      texture_size: 2048
children:
- id: floor
  type: architecture
  description: A square wooden plank floor tile.
  generation_prompt: One square modular floor tile, low and flat, made of wide worn oak floorboards running in one
    direction with visible grain and a few knots, straight clean outer edges and a flat underside. Viewed from a
    high three-quarter angle, isolated on a plain light-grey background.
  materials:
  - 'boards=nonmetal: worn matte oak floorboards'
- id: wall
  type: architecture
  description: A straight half-timbered wall module.
  generation_prompt: 'One straight modular half-timbered wall section, as wide as it is tall: a frame of thick dark
    oak beams, one along the bottom, one along the top and one at each end, with two diagonal braces, and rough
    off-white lime plaster filling the panels between the beams. Thick even depth, flat vertical ends and a flat
    top. Plain matching back. Front three-quarter view, isolated on a plain light-grey background.'
  materials:
  - 'beams=nonmetal: dark weathered oak timber beams'
  - 'panels=nonmetal: rough off-white lime plaster'
- id: window
  type: architecture
  description: A half-timbered wall module with a window.
  generation_prompt: 'One modular half-timbered wall section, as wide as it is tall: a frame of thick dark oak beams
    with rough off-white lime plaster panels, and one square window opening in the centre framed by thick oak beams,
    with two closed wooden shutters filling the opening. Thick even depth, flat vertical ends and a flat top. Plain
    matching back. Front three-quarter view, isolated on a plain light-grey background.'
  materials:
  - 'beams and shutters=nonmetal: dark weathered oak timber beams'
  - 'panels=nonmetal: rough off-white lime plaster'
- id: doorway
  type: architecture
  description: A half-timbered wall module with a doorway.
  generation_prompt: 'One modular half-timbered wall section, as wide as it is tall: a frame of thick dark oak beams
    with rough off-white lime plaster panels, and one human-sized rectangular doorway opening in the centre framed
    by thick oak posts and a lintel beam, the opening empty. Thick even depth, flat vertical ends and a flat top.
    Plain matching back. Front three-quarter view, isolated on a plain light-grey background.'
  materials:
  - 'beams=nonmetal: dark weathered oak timber beams'
  - 'panels=nonmetal: rough off-white lime plaster'
- id: corner
  type: architecture
  description: A 90-degree half-timbered corner module.
  aspect: landscape
  generation_prompt: 'One L-shaped 90-degree corner wall module of half-timbered construction: two equal straight
    arms joined at a right angle, each a frame of thick dark oak beams with rough off-white lime plaster panels,
    a thick oak post at the joint, the same height as its arm length, thick even depth, flat ends and flat top.
    Front three-quarter view, isolated on a plain light-grey background.'
  materials:
  - 'beams=nonmetal: dark weathered oak timber beams'
  - 'panels=nonmetal: rough off-white lime plaster'
layouts:
  room:
  - module: floor
    position:
    - -3
    - -3
  - module: floor
    position:
    - -3
    - 0
  - module: floor
    position:
    - -3
    - 3
  - module: floor
    position:
    - 0
    - -3
  - module: floor
    position:
    - 0
    - 0
  - module: floor
    position:
    - 0
    - 3
  - module: floor
    position:
    - 3
    - -3
  - module: floor
    position:
    - 3
    - 0
  - module: floor
    position:
    - 3
    - 3
  - module: corner
    position:
    - -3
    - -3
