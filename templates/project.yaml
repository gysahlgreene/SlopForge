project:
  name: Unity Project
  engine: unity

asset_pipeline:
  active_style: default
  output_root: Assets/Art/Generated
  candidate_root: ai/assets/candidates
  manifest: ai/assets/manifest.json

  defaults:
    image_candidates: 4
    model_candidates: 2
    material_candidates: 2

  material_scale: 3.0

  model_budgets:
    prop_faces: 30000
    hero_prop_faces: 60000
    architecture_faces: 60000
    collectible_faces: 20000
    character_faces: 60000
    weapon_faces: 30000  # a placeholder until the owner declares a weapon budget (M3)

  character_rigging_provider: blender_rigify

  workflows:
    image: image_text2img_api.json
    model: trellis2_image_to_model_api.json
    # Requires TRELLIS.2 models; generates mesh-aware PBR regions.

  # Select location with COMFYUI_URL; select quality independently with
  # SLOPFORGE_COMPUTE_PROFILE=mac|h100|h100_final.
  compute_profile: default
  compute_profiles:
    mac:
      workflows:
        model: trellis2_image_to_model_api.json
    # character_image: pose-conditioned concepts for asset types with pose_control (needs the
    # Z-Image Fun ControlNet Union patch; see docs/CHARACTER-RIGGING.md). guided_image: the same graph,
    # used for a prop concept generated with --shape-guide (see docs/AGENT-INTEGRATION.md).
    h100:
      workflows:
        model: trellis2_image_to_model_h100_api.json
        character_image: image_character_pose_api.json
        guided_image: image_character_pose_api.json
        character_model: trellis2_image_to_model_h100_character_api.json
        # Weapons keep TRELLIS.2 with Blender's reduction on every profile: on a pistol, longsword and crossbow it
        # matched the concepts' forms more cleanly than Pixal3D (docs/WEAPONS.md, 2026-10-24).
        weapon_model: trellis2_image_to_model_h100_api.json
    h100_final:
      workflows:
        model: pixal3d_image_to_model_h100_api.json
        character_image: image_character_pose_api.json
        guided_image: image_character_pose_api.json
        character_model: trellis2_image_to_model_h100_character_api.json
        # Weapons keep TRELLIS.2 with Blender's reduction on every profile: on a pistol, longsword and crossbow it
        # matched the concepts' forms more cleanly than Pixal3D (docs/WEAPONS.md, 2026-10-24).
        weapon_model: trellis2_image_to_model_h100_api.json
    # h100_multiview: props condition Pixal3D on generated front, side and back views of the
    # approved concept instead of guessing unseen sides from it (see docs/WORKFLOWS.md).
    h100_multiview:
      workflows:
        model: pixal3d_multiview_image_to_model_h100_api.json
        views: image_views_qwen_edit_api.json
        character_image: image_character_pose_api.json
        guided_image: image_character_pose_api.json
        character_model: trellis2_image_to_model_h100_character_api.json
        # Weapons keep TRELLIS.2 with Blender's reduction on every profile: on a pistol, longsword and crossbow it
        # matched the concepts' forms more cleanly than Pixal3D (docs/WEAPONS.md, 2026-10-24).
        weapon_model: trellis2_image_to_model_h100_api.json

  # Quality is independent of compute_profile and COMFYUI_URL.
  quality_tier: final
  quality_tiers:
    draft:
      defaults: {image_candidates: 1, model_candidates: 1, material_candidates: 1}
    normal: {}
    final:
      defaults: {image_candidates: 6, model_candidates: 3, material_candidates: 3}
      workflow_inputs:
        model:
          trellis2_image_to_model_api.json:
            crop: {pad_factor: 1.1}
          trellis2_image_to_model_h100_api.json:
            crop: {pad_factor: 1.1}
            shape_upsample_stage: {target_resolution: 1536}
            maps: {texture_size: 4096}
          trellis2_image_to_model_h100_character_api.json:
            crop: {pad_factor: 1.1}
            shape_upsample_stage: {target_resolution: 1536}
            maps: {texture_size: 4096}
          trellis2_image_to_model_h100_final_api.json:
            crop: {pad_factor: 1.1}
          pixal3d_image_to_model_h100_api.json:
            crop: {pad_factor: 1.1}
          pixal3d_multiview_image_to_model_h100_api.json:
            shape_upsample_stage: {target_resolution: 1536}
            maps: {texture_size: 4096}
      # Optionally map workflow basenames to API node/input overrides.
      # workflow_inputs:
      #   image:
      #     image_text2img_api.json:
      #       "5": {width: 1024, height: 1024}

  conditioning:
    strategy: text_only
    max_references: 3
    strength: 0.65
    workflow_inputs: []

  tools:
    comfy_url: http://127.0.0.1:8188
    comfy_backend: auto
    blender: null
    asset_python: null
    hunyuan_checkpoint: hunyuan3d-dit-v2_fp16.safetensors

  overwrite_existing: false
