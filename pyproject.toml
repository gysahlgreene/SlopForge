[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slopforge"
version = "0.2.0"
description = "A local-first 3D game-asset pipeline powered by ComfyUI, Blender, and Unity"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.15"
dependencies = ["numpy", "Pillow", "PyYAML", "rembg[cpu]"]

[project.scripts]
slopforge = "slopforge.cli:main"

[tool.setuptools.packages.find]
include = ["slopforge*"]

[tool.setuptools.data-files]
"share/slopforge/workflows" = ["workflows/*.json", "workflows/*.requirements.yaml"]
"share/slopforge/processing" = ["processing/*.py"]
"share/slopforge/blender" = ["blender/*.py"]
"share/slopforge/templates" = ["templates/project.yaml", "templates/manifest.json", "templates/AGENTS.md", "templates/CLAUDE.md"]
"share/slopforge/templates/style" = ["templates/style/style.yaml"]
"share/slopforge/templates/asset_types" = ["templates/asset_types/*.yaml"]
"share/slopforge/templates/recipes" = ["templates/recipes/*.yaml"]
"share/slopforge/templates/continue" = ["templates/continue/*.md"]
