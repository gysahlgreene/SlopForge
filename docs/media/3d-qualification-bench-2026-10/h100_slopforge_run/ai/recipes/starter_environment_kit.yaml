id: starter_environment_kit
version: 1
description: A modular sci-fi room kit with reusable surfaces, structures, and props.
kit_constraints:
  grid_size: 1.0
  snap_tolerance: 0.1
  pivot_tolerance: 0.15
  max_dimension: 8.0
  pivot: center
  modules:
    floor:
      snap_axes: [0, 1]
      flat_axis: 2
      max_dimension: 4.1
    wall:
      snap_axes: [0, 2]
      vertical_axis: 2
      max_dimension: 4.1
    corner:
      vertical_axis: 2
    doorway:
      snap_axes: [0, 2]
      vertical_axis: 2
      max_dimension: 4.1
    ceiling:
      flat_axis: 2
children:
  - id: floor
    type: architecture
    description: A square modular sci-fi floor tile with clean snap edges.
    generation_prompt: >-
      Match the active environment art style. Create one isolated square modular floor
      tile, exactly 3 by 3 game units, low profile, flat underside, clean edges and
      centered pivot. One object only, complete geometry, neutral studio background.
  - id: wall
    type: architecture
    description: A straight modular wall section with grid-aligned ends.
    generation_prompt: >-
      Match the active environment art style. Create one straight wall module, 3 units
      wide and 3 units high, with consistent thickness, vertical sides and clean ends
      that meet a 1-unit grid. Center the pivot. One isolated complete game-ready module.
  - id: corner
    type: architecture
    description: A 90-degree corner wall module matching the straight wall.
    generation_prompt: >-
      Match the active environment art style and wall construction. Create one L-shaped
      90-degree corner module that joins two 3-unit wall runs at a right angle, same
      height and thickness, clean grid-aligned ends, centered pivot, one isolated object.
  - id: ceiling
    type: architecture
    description: A square modular ceiling panel matching the floor and wall kit.
    generation_prompt: >-
      Match the active environment art style. Create one square 3 by 3 game-unit ceiling
      panel with a flat top, repeatable edge geometry, clean snap edges and centered
      pivot. One isolated complete module.
  - id: doorway
    type: architecture
    description: A wall section with a centered walkable doorway opening.
    generation_prompt: >-
      Match the active wall construction. Create a 3-unit-wide, 3-unit-high modular
      wall section with a centered human-scale doorway opening, clean grid-aligned outer
      edges, centered pivot, and one isolated complete object.
  - id: door
    type: prop
    description: A sliding door that fits the doorway module.
    generation_prompt: >-
      Match the active environment art style. Create one closed sci-fi sliding door sized
      to fit the doorway module, with a clear flat mounting side and centered pivot.
      Show the complete object in isolation on a neutral studio background.
  - id: column
    type: prop
    description: A structural column matching the wall and floor kit.
    generation_prompt: >-
      Match the active environment art style. Create one structural support column with
      a square footprint compatible with the floor tile and the same wall height. Center
      its pivot; show one complete isolated game-ready object.
  - id: pipe
    type: prop
    description: A modular wall-mounted pipe segment.
    generation_prompt: >-
      Match the active environment art style. Create one straight wall-mounted utility
      pipe segment with capped, repeatable ends and a restrained painted-steel material.
      Center the pivot and show the complete object in isolation.
  - id: terminal
    type: prop
    description: A wall-mounted refinery control terminal.
    generation_prompt: >-
      Match the active environment art style. Create one wall-mounted control terminal
      with an unlit blank screen and simple readable silhouette. Center the pivot, no
      readable text or symbols, one complete isolated object.
  - id: crate
    type: prop
    description: A stackable storage crate sized to the floor grid.
    generation_prompt: >-
      Match the active environment art style. Create one robust storage crate with a
      square footprint that stacks cleanly on the modular floor. Center the pivot and
      show the complete object in isolation.
  - id: painted_steel
    type: texture
    description: A repeatable painted-steel surface for the environment kit.
    generation_prompt: >-
      Match the active environment art style. Create a seamless-looking, front-facing
      painted-steel surface swatch with restrained wear and neutral cool tones. Surface
      only, no object, perspective, horizon, shadow, text, or border.
