project:
  name: h100_slopforge_run
  engine: unity
asset_pipeline:
  active_style: default
  output_root: Assets/Art/Generated
  candidate_root: ai/assets/candidates
  manifest: ai/assets/manifest.json
  defaults:
    image_candidates: 4
    model_candidates: 2
    material_candidates: 2
  material_scale: 3.0
  model_budgets:
    prop_faces: 30000
    hero_prop_faces: 60000
    architecture_faces: 60000
    collectible_faces: 20000
    character_faces: 60000
  character_rigging_provider: blender_rigify
  workflows:
    image: image_text2img_api.json
    model: trellis2_image_to_model_h100_api.json
  compute_profile: h100
  compute_profiles:
    mac:
      workflows:
        model: trellis2_image_to_model_api.json
    h100:
      workflows:
        model: trellis2_image_to_model_h100_api.json
    h100_final:
      workflows:
        model: trellis2_image_to_model_h100_final_api.json
  quality_tier: normal
  quality_tiers:
    draft:
      defaults:
        image_candidates: 1
        model_candidates: 1
        material_candidates: 1
    normal: {}
    final:
      defaults:
        image_candidates: 6
        model_candidates: 3
        material_candidates: 3
  conditioning:
    strategy: text_only
    max_references: 3
    strength: 0.65
    workflow_inputs: []
  tools:
    comfy_url: http://100.108.220.4:8188
    comfy_backend: remote
    blender: null
    asset_python: null
    hunyuan_checkpoint: hunyuan3d-dit-v2_fp16.safetensors
  overwrite_existing: false
  retain_sources: true
  retain_blend_preview: true
