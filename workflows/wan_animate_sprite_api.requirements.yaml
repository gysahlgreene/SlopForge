license_notes:
  - Wan Animate model weights, UMT5, and CLIP Vision match their Apache-2.0 artifacts by SHA-256.
  - The Wan 2.1 VAE matches its Comfy-Org artifact by SHA-256; upstream Wan license is Apache-2.0.
  - BiRefNet matches the official general MIT model, not the separate HR-matting variant.
  - Workflow nodes are ComfyUI core. No custom nodes or external provider APIs are required.
  - No upstream source code or workflow JSON is copied; this API graph is authored for SlopForge using the live core-node schema.
limitations:
  - The motion reference determines the animation; one generic motion clip is not a substitute for action-specific idle, walk, and attack drivers.
  - The first exploratory sample must pass identity, readable-motion, alpha, framing, and human-review checks before sprite packaging.
  - Pose/reference inputs and provider artifacts remain experimental; no Unity playback is included in this workflow.
